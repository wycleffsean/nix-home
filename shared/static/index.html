<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Server Services</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

        body {
            font-family: 'Orbitron', sans-serif;
            background-color: #0a0a0a;
            color: #0ff;
            text-align: center;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        h1 {
            font-size: 3rem;
            margin-top: 10vh;
            text-shadow: 0 0 10px #0ff, 0 0 20px #0ff;
            animation: flicker 1.5s infinite alternate;
        }

        @keyframes flicker {
            0% { opacity: 1; text-shadow: 0 0 10px #0ff, 0 0 20px #0ff; }
            100% { opacity: 0.8; text-shadow: 0 0 5px #0ff, 0 0 15px #0ff; }
        }

        .links {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 50px;
        }

        .link {
            display: inline-block;
            padding: 15px 30px;
            font-size: 1.5rem;
            text-decoration: none;
            color: #0ff;
            border: 2px solid #0ff;
            border-radius: 10px;
            transition: 0.3s ease-in-out;
            text-shadow: 0 0 10px #0ff, 0 0 20px #0ff;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(5px);
        }

        .link:hover {
            background-color: #0ff;
            color: #0a0a0a;
            text-shadow: 0 0 15px #0a0a0a;
            box-shadow: 0 0 20px #0ff;
        }

        .glow {
            position: absolute;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            background: radial-gradient(circle at center, rgba(0, 255, 255, 0.1) 10%, transparent 60%);
        }

    </style>
</head>
<body>

    <h1>Welcome to Raspberry Pi</h1>

    <div class="links">
        <a href="/jellyfin/" class="link">Jellyfin</a>
        <a href="/diag/" class="link">Diagnostics</a>
    </div>

    <div class="glow"></div>

</body>
</html>
